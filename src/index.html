<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator</title>
  <meta name="description" content="Plataforma de criação de conteúdo, planejamento, entregas para marcas e métricas.">
  <meta name="theme-color" content="#FAFAF9">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..800&family=Nunito:wght@300..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/platform.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Menu principal"></aside>
    <div class="workspace">
      <header id="topbar" class="topbar"></header>
      <main id="main" tabindex="-1"><p class="boot">Carregando…</p></main>
    </div>
  </div>
  <script>
    /* Se o site não abrir, mostra o motivo na tela em vez de ficar em branco. Escrito em JS antigo de propósito. */
    (function () {
      var erros = [];
      function mostrar(titulo) {
        if (window.__creatorStarted) return;
        var main = document.getElementById('main');
        if (!main) return;
        main.innerHTML = '';
        var box = document.createElement('div');
        box.className = 'empty boot-error';
        box.innerHTML = '<p class="empty-title"></p><p>Mande um print desta tela para eu arrumar.</p><pre class="boot-detail"></pre>';
        box.querySelector('.empty-title').textContent = titulo;
        box.querySelector('.boot-detail').textContent = erros.join('\n') + '\n\n' + navigator.userAgent;
        main.appendChild(box);
      }
      window.addEventListener('error', function (e) {
        erros.push((e && e.message) || 'Erro ao carregar');
        mostrar('O site não conseguiu abrir');
      });
      window.addEventListener('unhandledrejection', function (e) {
        erros.push(String((e && e.reason && (e.reason.message || e.reason)) || 'Erro'));
        mostrar('O site não conseguiu abrir');
      });
      setTimeout(function () { mostrar('O site está demorando para abrir'); }, 8000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
